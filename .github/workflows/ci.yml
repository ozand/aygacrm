name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monica_test
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://127.0.0.1:4000
      AUTH_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: app
        run: pnpm exec prisma generate

      - name: Push schema to test DB
        working-directory: app
        run: pnpm exec prisma db push --skip-generate

      - name: Install Playwright browsers
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: TypeScript check
        working-directory: app
        run: pnpm exec tsc --noEmit --skipLibCheck

      - name: Run tests
        working-directory: app
        run: pnpm test

      - name: Build
        working-directory: app
        run: pnpm next build

      - name: Run E2E smoke test
        working-directory: app
        run: pnpm exec playwright test e2e/smoke.spec.ts --project=chromium
